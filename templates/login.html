<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - SecInsight</title>
<style>
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #1a2a4a, #2c3e6b); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.box { background: #fff; border-radius: 12px; padding: 40px; width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
h1 { font-size: 20px; color: #1a2a4a; margin-bottom: 8px; }
p.sub { color: #888; font-size: 13px; margin-bottom: 24px; }
input { width: 100%; padding: 10px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; margin-bottom: 14px; box-sizing: border-box; }
button { width: 100%; padding: 10px; background: #1f3a5f; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
.err { color: #c0392b; font-size: 13px; margin-bottom: 12px; }
a { color: #1f6feb; text-decoration: none; font-size: 13px; }
.links { margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="box">
  <h1>SecInsight</h1>
  <p class="sub">API 审计告警智能分析平台</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <input name="username" placeholder="用户名" required>
    <input name="password" type="password" placeholder="密码" required>
    <button type="submit">登录</button>
  </form>
  <div class="links"><a href="/register">没有账号？注册</a></div>
</div>
</body>
</html>
